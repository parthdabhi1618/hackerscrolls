# Render Blueprint — https://render.com/docs/blueprint-spec
# This is a Web Service: the start command must bind to 0.0.0.0:$PORT.
# `npm run dev` (Vite) only binds to localhost:5173 and Render will reject it.
services:
  - type: web
    name: hackerscrolls
    runtime: node
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
